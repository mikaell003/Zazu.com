<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board</title>
    <style>
        :root {
            --todo: #ffbe76;
            --in-progress: #f0932b;
            --done: #6ab04c;
            --column-bg: #f1f2f6;
            --card-bg: #ffffff;
            --text: #2f3542;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #dfe4ea;
            color: var(--text);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            margin-bottom: 10px;
            color: #2f3542;
        }

        .kanban-board {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            padding-bottom: 20px;
        }

        .column {
            flex: 1;
            min-width: 300px;
            background-color: var(--column-bg);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 5px var(--shadow);
        }

        .column-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid;
        }

        .column-title {
            font-weight: bold;
            font-size: 18px;
        }

        .task-count {
            background-color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 14px;
        }

        .todo .column-header {
            color: var(--todo);
            border-color: var(--todo);
        }

        .in-progress .column-header {
            color: var(--in-progress);
            border-color: var(--in-progress);
        }

        .done .column-header {
            color: var(--done);
            border-color: var(--done);
        }

        .tasks {
            min-height: 100px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .task {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 2px 3px var(--shadow);
            cursor: grab;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .task:active {
            cursor: grabbing;
            transform: rotate(2deg);
            box-shadow: 0 5px 10px var(--shadow);
        }

        .task-title {
            font-weight: bold;
            margin-bottom: 8px;
        }

        .task-description {
            font-size: 14px;
            color: #57606f;
            margin-bottom: 10px;
        }

        .task-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #747d8c;
        }

        .task-priority {
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
        }

        .priority-low {
            background-color: #7bed9f;
            color: #2ed573;
        }

        .priority-medium {
            background-color: #ffa502;
            color: white;
        }

        .priority-high {
            background-color: #ff6b81;
            color: white;
        }

        .add-task {
            margin-top: 15px;
            width: 100%;
            padding: 8px;
            border: none;
            border-radius: 5px;
            background-color: white;
            color: #57606f;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: background-color 0.2s;
        }

        .add-task:hover {
            background-color: #e2e3e7;
        }

        .task-form {
            display: none;
            background-color: white;
            padding: 15px;
            border-radius: 5px;
            margin-top: 10px;
            box-shadow: 0 2px 5px var(--shadow);
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #57606f;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        .form-group textarea {
            min-height: 60px;
            resize: vertical;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 10px;
        }

        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-primary {
            background-color: #5352ed;
            color: white;
        }

        .btn-secondary {
            background-color: #a4b0be;
            color: white;
        }

        .dragging {
            opacity: 0.5;
            background-color: #f1f2f6;
        }

        .dropzone {
            background-color: rgba(223, 228, 234, 0.5);
            border: 2px dashed #a4b0be;
            border-radius: 5px;
        }

        @media (max-width: 768px) {
            .kanban-board {
                flex-direction: column;
            }
            
            .column {
                min-width: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Kanban Board</h1>
            <p>Drag and drop tasks between columns to manage your workflow</p>
        </header>

        <div class="kanban-board">
            <div class="column todo" data-status="todo">
                <div class="column-header">
                    <span class="column-title">To Do</span>
                    <span class="task-count">0</span>
                </div>
                <div class="tasks" id="todo-tasks">
                    <!-- Tasks will be added here -->
                </div>
                <button class="add-task" onclick="showTaskForm('todo')">
                    <span>+</span> Add Task
                </button>
                <div class="task-form" id="todo-form">
                    <div class="form-group">
                        <label for="todo-title">Title</label>
                        <input type="text" id="todo-title" placeholder="Task title">
                    </div>
                    <div class="form-group">
                        <label for="todo-description">Description</label>
                        <textarea id="todo-description" placeholder="Task description"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="todo-priority">Priority</label>
                        <select id="todo-priority">
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                    <div class="form-actions">
                        <button class="btn btn-secondary" onclick="hideTaskForm('todo')">Cancel</button>
                        <button class="btn btn-primary" onclick="addTask('todo')">Add Task</button>
                    </div>
                </div>
            </div>

            <div class="column in-progress" data-status="in-progress">
                <div class="column-header">
                    <span class="column-title">In Progress</span>
                    <span class="task-count">0</span>
                </div>
                <div class="tasks" id="in-progress-tasks">
                    <!-- Tasks will be added here -->
                </div>
                <button class="add-task" onclick="showTaskForm('in-progress')">
                    <span>+</span> Add Task
                </button>
                <div class="task-form" id="in-progress-form">
                    <div class="form-group">
                        <label for="in-progress-title">Title</label>
                        <input type="text" id="in-progress-title" placeholder="Task title">
                    </div>
                    <div class="form-group">
                        <label for="in-progress-description">Description</label>
                        <textarea id="in-progress-description" placeholder="Task description"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="in-progress-priority">Priority</label>
                        <select id="in-progress-priority">
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                    <div class="form-actions">
                        <button class="btn btn-secondary" onclick="hideTaskForm('in-progress')">Cancel</button>
                        <button class="btn btn-primary" onclick="addTask('in-progress')">Add Task</button>
                    </div>
                </div>
            </div>

            <div class="column done" data-status="done">
                <div class="column-header">
                    <span class="column-title">Done</span>
                    <span class="task-count">0</span>
                </div>
                <div class="tasks" id="done-tasks">
                    <!-- Tasks will be added here -->
                </div>
                <button class="add-task" onclick="showTaskForm('done')">
                    <span>+</span> Add Task
                </button>
                <div class="task-form" id="done-form">
                    <div class="form-group">
                        <label for="done-title">Title</label>
                        <input type="text" id="done-title" placeholder="Task title">
                    </div>
                    <div class="form-group">
                        <label for="done-description">Description</label>
                        <textarea id="done-description" placeholder="Task description"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="done-priority">Priority</label>
                        <select id="done-priority">
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                    <div class="form-actions">
                        <button class="btn btn-secondary" onclick="hideTaskForm('done')">Cancel</button>
                        <button class="btn btn-primary" onclick="addTask('done')">Add Task</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Sample tasks data
        let tasks = [
            {
                id: 1,
                title: "Design homepage layout",
                description: "Create wireframes and mockups for the new homepage design",
                priority: "high",
                status: "todo",
                createdAt: new Date()
            },
            {
                id: 2,
                title: "Implement user authentication",
                description: "Set up login and registration functionality",
                priority: "medium",
                status: "in-progress",
                createdAt: new Date()
            },
            {
                id: 3,
                title: "Write API documentation",
                description: "Document all endpoints for the REST API",
                priority: "low",
                status: "done",
                createdAt: new Date()
            }
        ];

        // DOM elements
        const todoTasks = document.getElementById('todo-tasks');
        const inProgressTasks = document.getElementById('in-progress-tasks');
        const doneTasks = document.getElementById('done-tasks');

        // Initialize the board
        document.addEventListener('DOMContentLoaded', function() {
            renderTasks();
            setupDragAndDrop();
        });

        // Render all tasks on the board
        function renderTasks() {
            // Clear all columns
            todoTasks.innerHTML = '';
            inProgressTasks.innerHTML = '';
            doneTasks.innerHTML = '';

            // Sort tasks by creation date (newest first)
            tasks.sort((a, b) => b.createdAt - a.createdAt);

            // Render each task in the appropriate column
            tasks.forEach(task => {
                const taskElement = createTaskElement(task);
                if (task.status === 'todo') {
                    todoTasks.appendChild(taskElement);
                } else if (task.status === 'in-progress') {
                    inProgressTasks.appendChild(taskElement);
                } else if (task.status === 'done') {
                    doneTasks.appendChild(taskElement);
                }
            });

            // Update task counts
            updateTaskCounts();
            
            // Re-setup drag and drop for the new tasks
            setupDragAndDrop();
        }

        // Create a task element
        function createTaskElement(task) {
            const taskElement = document.createElement('div');
            taskElement.className = 'task';
            taskElement.draggable = true;
            taskElement.dataset.taskId = task.id;

            // Format date
            const dateStr = task.createdAt.toLocaleDateString('en-US', {
                month: 'short',
                day: 'numeric'
            });

            // Priority class
            const priorityClass = `priority-${task.priority}`;

            taskElement.innerHTML = `
                <div class="task-title">${task.title}</div>
                <div class="task-description">${task.description}</div>
                <div class="task-footer">
                    <span class="task-priority ${priorityClass}">${task.priority}</span>
                    <span>${dateStr}</span>
                </div>
            `;

            return taskElement;
        }

        // Update task counts in column headers
        function updateTaskCounts() {
            const todoCount = document.querySelector('.todo .task-count');
            const inProgressCount = document.querySelector('.in-progress .task-count');
            const doneCount = document.querySelector('.done .task-count');

            todoCount.textContent = tasks.filter(t => t.status === 'todo').length;
            inProgressCount.textContent = tasks.filter(t => t.status === 'in-progress').length;
            doneCount.textContent = tasks.filter(t => t.status === 'done').length;
        }

        // Show the add task form
        function showTaskForm(status) {
            document.getElementById(`${status}-form`).style.display = 'block';
            document.querySelector(`.${status} .add-task`).style.display = 'none';
        }

        // Hide the add task form
        function hideTaskForm(status) {
            document.getElementById(`${status}-form`).style.display = 'none';
            document.querySelector(`.${status} .add-task`).style.display = 'flex';
            
            // Clear form fields
            document.getElementById(`${status}-title`).value = '';
            document.getElementById(`${status}-description`).value = '';
            document.getElementById(`${status}-priority`).value = 'low';
        }

        // Add a new task
        function addTask(status) {
            const title = document.getElementById(`${status}-title`).value.trim();
            const description = document.getElementById(`${status}-description`).value.trim();
            const priority = document.getElementById(`${status}-priority`).value;

            if (!title) {
                alert('Please enter a task title');
                return;
            }

            // Create new task
            const newTask = {
                id: Date.now(), // Use timestamp as unique ID
                title,
                description,
                priority,
                status,
                createdAt: new Date()
            };

            tasks.push(newTask);
            renderTasks();
            hideTaskForm(status);
        }

        // Set up drag and drop functionality
        function setupDragAndDrop() {
            const taskElements = document.querySelectorAll('.task');
            const columns = document.querySelectorAll('.tasks');

            let draggedTask = null;

            // Drag start
            taskElements.forEach(task => {
                task.addEventListener('dragstart', function() {
                    draggedTask = this;
                    setTimeout(() => {
                        this.classList.add('dragging');
                    }, 0);
                });

                task.addEventListener('dragend', function() {
                    this.classList.remove('dragging');
                    draggedTask = null;
                });
            });

            // Drag over columns
            columns.forEach(column => {
                column.addEventListener('dragover', function(e) {
                    e.preventDefault();
                    const dragging = document.querySelector('.dragging');
                    if (dragging) {
                        const afterElement = getDragAfterElement(this, e.clientY);
                        if (afterElement) {
                            this.insertBefore(dragging, afterElement);
                        } else {
                            this.appendChild(dragging);
                        }
                    }
                });

                column.addEventListener('drop', function(e) {
                    e.preventDefault();
                    if (draggedTask) {
                        // Update task status in data
                        const taskId = parseInt(draggedTask.dataset.taskId);
                        const newStatus = this.parentElement.dataset.status;
                        
                        const taskIndex = tasks.findIndex(t => t.id === taskId);
                        if (taskIndex !== -1) {
                            tasks[taskIndex].status = newStatus;
                        }
                        
                        updateTaskCounts();
                    }
                });
            });
        }

        // Helper function for drag and drop positioning
        function getDragAfterElement(container, y) {
            const draggableElements = [...container.querySelectorAll('.task:not(.dragging)')];

            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                
                if (offset < 0 && offset > closest.offset) {
                    return { offset: offset, element: child };
                } else {
                    return closest;
                }
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }
    </script>
</body>
</html>
