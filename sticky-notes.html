<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky Notes Tool</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .header h1 {
            color: #5c6bc0;
            font-size: 36px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        
        .header p {
            color: #666;
            font-size: 18px;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #5c6bc0 0%, #3949ab 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(92, 107, 192, 0.3);
        }
        
        .btn-secondary {
            background: white;
            color: #5c6bc0;
            border: 2px solid #5c6bc0;
        }
        
        .btn-secondary:hover {
            background: #f5f7fa;
        }
        
        .btn-danger {
            background: #ff5252;
            color: white;
        }
        
        .btn-danger:hover {
            background: #ff3545;
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(255, 82, 82, 0.3);
        }
        
        .notes-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            padding: 10px;
        }
        
        .note {
            background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%);
            border-radius: 12px;
            padding: 20px;
            min-height: 250px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .note:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.2);
        }
        
        .note-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }
        
        .note-date {
            font-size: 12px;
            color: #888;
        }
        
        .note-actions {
            display: flex;
            gap: 10px;
        }
        
        .note-action {
            background: none;
            border: none;
            font-size: 14px;
            cursor: pointer;
            color: #666;
            transition: color 0.3s;
            padding: 5px;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .note-action:hover {
            background: rgba(0, 0, 0, 0.05);
            color: #333;
        }
        
        .note-content {
            flex: 1;
            outline: none;
            padding: 5px;
            overflow-y: auto;
            font-size: 16px;
            line-height: 1.5;
            color: #333;
        }
        
        .note-content:focus {
            background: rgba(255, 255, 255, 0.5);
            border-radius: 5px;
        }
        
        .note-color-picker {
            position: absolute;
            bottom: 15px;
            right: 15px;
            display: flex;
            gap: 5px;
        }
        
        .color-option {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.2s;
        }
        
        .color-option:hover {
            transform: scale(1.2);
        }
        
        .color-option.active {
            border-color: white;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
        }
        
        .note.yellow {
            background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%);
        }
        
        .note.blue {
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
        }
        
        .note.green {
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
        }
        
        .note.pink {
            background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 100%);
        }
        
        .note.purple {
            background: linear-gradient(135deg, #f3e5f5 0%, #e1bee7 100%);
        }
        
        .note.orange {
            background: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%);
        }
        
        .empty-state {
            text-align: center;
            padding: 50px;
            grid-column: 1 / -1;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .empty-state i {
            font-size: 60px;
            color: #5c6bc0;
            margin-bottom: 20px;
        }
        
        .empty-state h3 {
            color: #5c6bc0;
            margin-bottom: 10px;
        }
        
        .empty-state p {
            color: #666;
            margin-bottom: 20px;
        }
        
        @media (max-width: 600px) {
            .header h1 {
                font-size: 28px;
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 100%;
                max-width: 300px;
                justify-content: center;
            }
            
            .notes-container {
                grid-template-columns: 1fr;
            }
        }
        
        .note-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
            font-size: 12px;
            color: #888;
        }
        
        .note-word-count {
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-sticky-note"></i> Sticky Notes Tool</h1>
            <p>Organize your thoughts and tasks with colorful sticky notes</p>
        </div>
        
        <div class="controls">
            <button class="btn btn-primary" id="add-note-btn">
                <i class="fas fa-plus"></i> Add New Note
            </button>
            <button class="btn btn-secondary" id="save-notes-btn">
                <i class="fas fa-save"></i> Save All Notes
            </button>
            <button class="btn btn-danger" id="clear-notes-btn">
                <i class="fas fa-trash"></i> Clear All Notes
            </button>
        </div>
        
        <div class="notes-container" id="notes-container">
            <div class="empty-state" id="empty-state">
                <i class="fas fa-sticky-note"></i>
                <h3>No notes yet</h3>
                <p>Click the "Add New Note" button to create your first sticky note</p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // DOM Elements
            const notesContainer = document.getElementById('notes-container');
            const addNoteBtn = document.getElementById('add-note-btn');
            const saveNotesBtn = document.getElementById('save-notes-btn');
            const clearNotesBtn = document.getElementById('clear-notes-btn');
            const emptyState = document.getElementById('empty-state');
            
            // Colors for notes
            const noteColors = [
                { name: 'yellow', value: 'linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%)' },
                { name: 'blue', value: 'linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%)' },
                { name: 'green', value: 'linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%)' },
                { name: 'pink', value: 'linear-gradient(135deg, #fce4ec 0%, #f8bbd0 100%)' },
                { name: 'purple', value: 'linear-gradient(135deg, #f3e5f5 0%, #e1bee7 100%)' },
                { name: 'orange', value: 'linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%)' }
            ];
            
            // State
            let notes = JSON.parse(localStorage.getItem('stickyNotes')) || [];
            
            // Initialize the app
            function init() {
                renderNotes();
                
                // Event listeners
                addNoteBtn.addEventListener('click', addNewNote);
                saveNotesBtn.addEventListener('click', saveAllNotes);
                clearNotesBtn.addEventListener('click', clearAllNotes);
            }
            
            // Add a new note
            function addNewNote() {
                const newNote = {
                    id: Date.now(),
                    content: '',
                    color: 'yellow',
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString()
                };
                
                notes.push(newNote);
                saveNotes();
                renderNotes();
                
                // Focus on the new note
                const newNoteElement = document.querySelector(`[data-id="${newNote.id}"] .note-content`);
                if (newNoteElement) {
                    newNoteElement.focus();
                }
            }
            
            // Render all notes
            function renderNotes() {
                if (notes.length === 0) {
                    emptyState.style.display = 'block';
                    notesContainer.innerHTML = '';
                    notesContainer.appendChild(emptyState);
                    return;
                }
                
                emptyState.style.display = 'none';
                notesContainer.innerHTML = '';
                
                notes.forEach(note => {
                    const noteElement = document.createElement('div');
                    noteElement.className = `note ${note.color}`;
                    noteElement.dataset.id = note.id;
                    
                    const createdAt = new Date(note.createdAt);
                    const updatedAt = new Date(note.updatedAt);
                    const wordCount = note.content.trim() ? note.content.trim().split(/\s+/).length : 0;
                    
                    noteElement.innerHTML = `
                        <div class="note-header">
                            <div class="note-date">${formatDate(createdAt)}</div>
                            <div class="note-actions">
                                <button class="note-action" title="Delete note" data-action="delete">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                        <div class="note-content" contenteditable="true">${note.content}</div>
                        <div class="note-footer">
                            <div class="note-word-count">${wordCount} words</div>
                            <div class="note-updated">Updated: ${formatTime(updatedAt)}</div>
                        </div>
                        <div class="note-color-picker">
                            ${noteColors.map(color => `
                                <div class="color-option ${note.color === color.name ? 'active' : ''}" 
                                     style="background: ${color.value}" 
                                     data-color="${color.name}" 
                                     title="${color.name.charAt(0).toUpperCase() + color.name.slice(1)} note">
                                </div>
                            `).join('')}
                        </div>
                    `;
                    
                    notesContainer.appendChild(noteElement);
                    
                    // Add event listeners
                    const contentEditable = noteElement.querySelector('.note-content');
                    const deleteBtn = noteElement.querySelector('[data-action="delete"]');
                    const colorOptions = noteElement.querySelectorAll('.color-option');
                    
                    contentEditable.addEventListener('input', function() {
                        updateNoteContent(note.id, this.textContent);
                    });
                    
                    contentEditable.addEventListener('blur', function() {
                        updateNoteContent(note.id, this.textContent);
                    });
                    
                    deleteBtn.addEventListener('click', function() {
                        deleteNote(note.id);
                    });
                    
                    colorOptions.forEach(option => {
                        option.addEventListener('click', function() {
                            changeNoteColor(note.id, this.dataset.color);
                        });
                    });
                });
            }
            
            // Update note content
            function updateNoteContent(noteId, content) {
                notes = notes.map(note => {
                    if (note.id === noteId) {
                        return {
                            ...note,
                            content: content,
                            updatedAt: new Date().toISOString()
                        };
                    }
                    return note;
                });
                
                // Update word count
                const noteElement = document.querySelector(`[data-id="${noteId}"]`);
                if (noteElement) {
                    const wordCountElement = noteElement.querySelector('.note-word-count');
                    const wordCount = content.trim() ? content.trim().split(/\s+/).length : 0;
                    wordCountElement.textContent = `${wordCount} words`;
                    
                    const updatedElement = noteElement.querySelector('.note-updated');
                    updatedElement.textContent = `Updated: ${formatTime(new Date())}`;
                }
                
                saveNotes();
            }
            
            // Change note color
            function changeNoteColor(noteId, color) {
                notes = notes.map(note => {
                    if (note.id === noteId) {
                        return {
                            ...note,
                            color: color,
                            updatedAt: new Date().toISOString()
                        };
                    }
                    return note;
                });
                
                saveNotes();
                renderNotes();
            }
            
            // Delete a note
            function deleteNote(noteId) {
                if (confirm('Are you sure you want to delete this note?')) {
                    notes = notes.filter(note => note.id !== noteId);
                    saveNotes();
                    renderNotes();
                }
            }
            
            // Save all notes to localStorage
            function saveAllNotes() {
                saveNotes();
                alert('All notes have been saved successfully!');
            }
            
            // Clear all notes
            function clearAllNotes() {
                if (confirm('Are you sure you want to clear all notes? This action cannot be undone.')) {
                    notes = [];
                    saveNotes();
                    renderNotes();
                }
            }
            
            // Save notes to localStorage
            function saveNotes() {
                localStorage.setItem('stickyNotes', JSON.stringify(notes));
            }
            
            // Format date for display
            function formatDate(date) {
                return date.toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric'
                });
            }
            
            // Format time for display
            function formatTime(date) {
                return date.toLocaleTimeString('en-US', {
                    hour: '2-digit',
                    minute: '2-digit'
                });
            }
            
            // Initialize the application
            init();
        });
    </script>
</body>
</html>
